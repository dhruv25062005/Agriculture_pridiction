<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;

  --glass:rgba(255,255,255,0.08);
  --blur:blur(18px);

  --primary:#00c853;
  --primary-glow:#1de9b6;

  --input:#1f2a36;
  --text:#e6f1ff;
  --muted:#9bb3c9;
}

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
}

/* MAIN CARD */
.auth-card{
  width:1100px;
  max-width:95%;
  height:620px;
  background:var(--glass);
  backdrop-filter:var(--blur);
  border-radius:22px;
  display:flex;
  overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}

/* LEFT PANEL */
.left{
  width:45%;
  position:relative;
  background:
    linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.7)),
    url("/static/image.jpeg") center/cover no-repeat;
}

.left-content{
  height:100%;
  padding:35px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:600;
  letter-spacing:1px;
}

.tagline{
  text-align:center;
  font-size:22px;
  font-weight:500;
  line-height:1.4;
}

.tagline span{
  color:var(--primary);
}

/* RIGHT PANEL */
.right{
  width:55%;
  padding:55px 65px;
}

.right h1{
  margin:0 0 8px;
  font-weight:600;
}

.right p{
  margin-bottom:28px;
  font-size:14px;
  color:var(--muted);
}

.right a{
  color:var(--primary-glow);
  cursor:pointer;
  text-decoration:none;
}

.right a:hover{text-decoration:underline}

/* FORM */
.form{width:100%}

.row{
  display:flex;
  gap:12px;
}

input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:none;
  background:var(--input);
  color:var(--text);
  margin-bottom:15px;
  outline:none;
}

input:focus{
  box-shadow:0 0 0 2px rgba(0,200,83,.5);
}

input::placeholder{
  color:#8ea3b5;
}

button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-glow));
  color:#002b1a;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(0,200,83,.6);
}

.forgot-wrapper{
  text-align:right;
  margin-bottom:15px;
}

.forgot-btn{
  background:none;
  border:none;
  color:var(--primary-glow);
  font-size:13px;
  cursor:pointer;
}

.divider{
  text-align:center;
  margin:22px 0;
  font-size:12px;
  color:var(--muted);
}

.social{
  display:flex;
  gap:12px;
}

.social button{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.social button:hover{
  box-shadow:0 0 20px rgba(255,255,255,.25);
}

.hidden{display:none}

/* RESPONSIVE */
@media(max-width:900px){
  .auth-card{flex-direction:column;height:auto}
  .left,.right{width:100%}
  .right{padding:40px}
}
</style>
</head>

<body>

<div class="auth-card">

  <!-- LEFT -->
  <div class="left">
    <div class="left-content">
      
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- SIGN UP -->
    <div id="signup-box">
      <h1>Create an account</h1>
      <p>Already have an account? <a onclick="showLogin()">Login</a></p>

      <form class="form" id="signup-form">
        <div class="row">
          <input placeholder="First name">
          <input placeholder="Last name">
        </div>

        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Enter your password" required>

       

        <button>Create account</button>
         <div class="social">
 <button type="button" id="google-signin-btn">
                   Continue with Google
                        </button>        </div>


       
      </form>
    </div>

    <!-- SIGN IN -->
    <div id="login-box" class="hidden">
      <h1>Sign in</h1>
      <p>Don’t have an account? <a onclick="showSignup()">Create one</a></p>

      <form class="form" id="signin-form">
        <input type="email" id="signin-email" placeholder="Email" required>
        <input type="password" id="signin-password" placeholder="Password" required>

        <div class="forgot-wrapper">
          <button type="button" class="forgot-btn" onclick="showForgot()">
            Forgot password?
          </button>
        </div>
        

        <button>Sign in</button>
         <div class="social">
          <button type="button" id="google-signin-btn">
                   Continue with Google
                        </button>

        </div>
      </form>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="forgot-box" class="hidden">
      <h1>Reset password</h1>
      <p>Enter your email to receive a reset link</p>

      <form class="form" id="forgot-form">
        <input type="email" id="forgot-email" placeholder="Email" required>
        <button>Send reset link</button>
      </form>

      <p style="margin-top:15px">
        <a onclick="showLogin()">← Back to login</a>
      </p>
    </div>

  </div>
</div>

<!-- UI TOGGLE LOGIC -->
<script>
function showLogin(){
  signupBox(false); forgotBox(false); loginBox(true);
}
function showSignup(){
  loginBox(false); forgotBox(false); signupBox(true);
}
function showForgot(){
  loginBox(false); signupBox(false); forgotBox(true);
}
function signupBox(v){document.getElementById("signup-box").classList.toggle("hidden",!v)}
function loginBox(v){document.getElementById("login-box").classList.toggle("hidden",!v)}
function forgotBox(v){document.getElementById("forgot-box").classList.toggle("hidden",!v)}
</script>

<!-- FIREBASE FILES (UNCHANGED) -->
<script type="module" src="/static/js/firebase-config.js"></script>
<script type="module" src="/static/js/signup.js"></script>
<script type="module" src="/static/js/signin.js"></script>
<script type="module" src="/static/js/forgot-password.js"></script>

</body>
</html>
